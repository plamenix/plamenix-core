[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-beta"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Plamenix Contributors"]

[workspace.dependencies]
# Pinned versions used by every member crate. Adding a third-party dependency
# here is a deliberate act: each entry costs review time, supply-chain trust,
# and compile time. Add only when concretely needed; remove when no longer used.
uuid = { version = "1", features = ["v4", "serde"] }
# URL parsing for the plugin host's outbound-network allow-list. Hand-rolled
# host extraction is where SSRF bugs live; this is the one place a mistake
# would let a plugin reach a host the user never approved.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "process", "time"] }
rsfbclient = { version = "0.26", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic"] }
toml = "0.9"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
wasmtime = { version = "27", default-features = false, features = ["runtime", "cranelift", "component-model", "async"] }
wasmtime-wasi = { version = "27" }
keyring = { version = "3", default-features = false }
specta = { version = "2.0.0-rc.25", features = ["serde_json", "uuid", "derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
specta-util = "0.0.12"
plamenix-types = { path = "crates/plamenix-types" }
plamenix-db = { path = "crates/plamenix-db" }
plamenix-plugin-host = { path = "crates/plamenix-plugin-host" }
plamenix-plugin-sdk = { path = "crates/plamenix-plugin-sdk" }
plamenix-secrets = { path = "crates/plamenix-secrets" }
plamenix-profiles = { path = "crates/plamenix-profiles" }
plamenix-tracing = { path = "crates/plamenix-tracing" }

[workspace.lints.rust]
# `deny` so individual crates can narrow to `allow` on a specific
# module (e.g. `plamenix-db::crypt_callback` for the Firebird FFI
# shim). Crates with no `unsafe` needs add `#![forbid(unsafe_code)]`
# at their `lib.rs` root for an extra belt-and-braces guarantee.
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1

[patch.crates-io]
# Vendored copy that adds SQL_ARRAY (540) decoding via
# `isc_array_lookup_bounds` + `isc_array_get_slice` on top of the
# upstream 0.26 release. See `vendor/rsfbclient-native/src/row.rs`.
rsfbclient-native = { path = "vendor/rsfbclient-native" }
# Vendored copy that stops coercing NUMERIC/DECIMAL columns to f64.
# Upstream describes scaled integers as SQL_DOUBLE, which loses the
# exact value inside the driver before any caller sees it. See
# `vendor/rsfbclient-rust/src/xsqlda.rs` and the upstream report drafted
# at `docs/upstream-rsfbclient-numeric.md` in the plamenix meta repo.
rsfbclient-rust = { path = "vendor/rsfbclient-rust" }
